name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # VS Code platform targets. ryl ships musl builds, so Linux and Alpine
        # share a binary; armhf uses the gnueabihf build. The download script
        # extracts each (tar for *nix, unzip for the Windows .zip) on Linux.
        target:
          - win32-x64
          - win32-arm64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - linux-armhf
          - alpine-x64
          - alpine-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download ryl for ${{ matrix.target }}
        run: node scripts/download-ryl.mjs --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package VSIX
        run: npx vsce package --target "$TARGET" -o "dist/ryl-$TARGET.vsix"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true
      - name: List packaged VSIX
        run: ls -l dist
      - name: Publish to the VS Marketplace
        run: npx vsce publish --packagePath dist/*.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ always() }}
        run: npx ovsx publish --packagePath dist/*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
      - name: Create GitHub release
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        # Idempotent: a rerun (after a transient publish failure) uploads to the
        # existing release instead of failing because the tag release exists.
        run: |-
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
