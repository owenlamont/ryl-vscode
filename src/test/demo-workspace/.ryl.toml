# Demo workspace for scripts/record_demo.py. Only safe-fixable rules are
# enabled, so `ryl.fixAll` reflows the typed sample to a fully clean document.
[files]
yaml = ["*.yaml", "*.yml"]
markdown = ["*.md"]

[lint.rules]
trailing-spaces = "enable"
new-line-at-end-of-file = "enable"
commas = "enable"

[lint.rules.braces]
max-spaces-inside = 1

[lint.rules.brackets]
max-spaces-inside = 1

[lint.rules.quoted-strings]
quote-type = "double"
required = "only-when-needed"

[lint.rules.comments]
require-starting-space = true

[lint.rules.empty-lines]
max = 1

[lint.rules.document-start]
present = true
