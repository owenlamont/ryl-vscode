# Only safe-fixable rules are enabled, so `ryl.fixAll` leaves the typed sample
# lint-clean and Format Document has only style left to change.
[files]
yaml =["*.yaml", "*.yml"]
markdown = ["*.md"]

[format]
quote-style = "single"
max-blank-lines = 1

[lint.rules]
trailing-spaces = "enable"
new-line-at-end-of-file = "enable"
commas = "enable"

[lint.rules.braces]
max-spaces-inside = 1

[lint.rules.brackets]
max-spaces-inside = 1

[lint.rules.comments]
require-starting-space = true

[lint.rules.empty-lines]
max = 1

[lint.rules.document-start]
present = true
